<!DOCTYPE html>
<html lang="kk" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKZHAR - Кіру</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .hero-bg { 
            background: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.9)), url('https://images.unsplash.com/photo-1620712943543-bcc4688e7485?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80'); 
            background-size: cover; background-position: center; 
        }
        .form-enter { animation: fadeUp 0.4s ease-out forwards; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="hero-bg h-screen flex items-center justify-center px-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden form-enter border-t-4 border-[#a6140c]">
        
        <div class="flex border-b border-gray-200">
            <button onclick="switchTab('login')" id="tab-login" class="w-1/2 py-4 font-bold text-[#a6140c] border-b-2 border-[#a6140c] bg-gray-50 transition">Кіру</button>
            <button onclick="switchTab('register')" id="tab-register" class="w-1/2 py-4 font-bold text-gray-400 hover:text-black transition">Тіркелу</button>
        </div>

        <div class="p-8">
            <h2 id="form-title" class="text-2xl font-black text-center mb-6 text-black">Қош келдіңіз!</h2>

            <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
                
                <div id="name-field" class="hidden">
                    <label class="text-xs font-bold text-gray-500 uppercase">Аты-жөні</label>
                    <input type="text" id="name" class="w-full bg-[#efefef] border border-gray-200 p-3 rounded-lg focus:outline-none focus:border-[#a6140c]" placeholder="Есіміңіз...">
                </div>

                <div>
                    <label class="text-xs font-bold text-gray-500 uppercase">Email</label>
                    <input type="email" id="email" required class="w-full bg-[#efefef] border border-gray-200 p-3 rounded-lg focus:outline-none focus:border-[#a6140c]" placeholder="name@mail.com">
                </div>

                <div>
                    <label class="text-xs font-bold text-gray-500 uppercase">Құпия сөз</label>
                    <input type="password" id="password" required class="w-full bg-[#efefef] border border-gray-200 p-3 rounded-lg focus:outline-none focus:border-[#a6140c]" placeholder="••••••••">
                </div>

                <div id="error-msg" class="text-[#a6140c] text-sm font-bold text-center hidden"></div>

                <button type="submit" id="submit-btn" class="w-full bg-[#a6140c] text-white font-bold py-3 rounded-lg hover:bg-[#8a100a] transition transform hover:scale-[1.02]">
                    Кіру
                </button>
            </form>
            
            <div class="mt-6 text-center text-xs text-gray-400">
                <a href="index.html" class="hover:text-[#a6140c] underline">← Басты бетке қайту</a>
            </div>
        </div>
    </div>

    <script>
        let isLoginMode = true;

        function switchTab(mode) {
            isLoginMode = (mode === 'login');
            const title = document.getElementById('form-title');
            const btn = document.getElementById('submit-btn');
            const nameField = document.getElementById('name-field');
            const errorMsg = document.getElementById('error-msg');

            // Reset styles
            document.getElementById('tab-login').className = isLoginMode ? "w-1/2 py-4 font-bold text-[#a6140c] border-b-2 border-[#a6140c] bg-gray-50 transition" : "w-1/2 py-4 font-bold text-gray-400 hover:text-black transition";
            document.getElementById('tab-register').className = !isLoginMode ? "w-1/2 py-4 font-bold text-[#a6140c] border-b-2 border-[#a6140c] bg-gray-50 transition" : "w-1/2 py-4 font-bold text-gray-400 hover:text-black transition";

            if (isLoginMode) {
                title.innerText = "Қош келдіңіз!";
                btn.innerText = "Кіру";
                nameField.classList.add('hidden');
            } else {
                title.innerText = "Тіркелу";
                btn.innerText = "Тіркелу";
                nameField.classList.remove('hidden');
            }
            errorMsg.classList.add('hidden');
        }

        function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const name = document.getElementById('name').value;
            const errorMsg = document.getElementById('error-msg');

            // --- LOCAL STORAGE LOGIC (БАЗА ДАННЫХ) ---
            
            if (!isLoginMode) {
                // РЕГИСТРАЦИЯ
                if(localStorage.getItem(email)) {
                    errorMsg.innerText = "Бұл Email тіркелген!";
                    errorMsg.classList.remove('hidden');
                    return;
                }
                // Сақтау (Базаға жазу)
                const userData = { name: name, password: password };
                localStorage.setItem(email, JSON.stringify(userData));
                localStorage.setItem('currentUser', email); // Авто-логин
                
                alert('Сәтті тіркелдіңіз!');
                window.location.href = 'resources.html';
            } else {
                // КІРУ (LOGIN)
                const storedUser = localStorage.getItem(email);
                if (!storedUser) {
                    errorMsg.innerText = "Мұндай қолданушы табылмады!";
                    errorMsg.classList.remove('hidden');
                    return;
                }
                
                const userData = JSON.parse(storedUser);
                if (userData.password === password) {
                    localStorage.setItem('currentUser', email); // Сессияны сақтау
                    window.location.href = 'resources.html';
                } else {
                    errorMsg.innerText = "Құпия сөз қате!";
                    errorMsg.classList.remove('hidden');
                }
            }
        }
    </script>
</body>
</html>
